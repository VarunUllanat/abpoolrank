[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cofoldrank"
version = "1.1.0"
description = "Predictor-agnostic structural selection for antibody-antigen co-folding"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Varun Ullanat", email = "varun@divergencelabs.com" }]

# Core = what `cofoldrank select` needs: parse structures, compare poses, score the pool.
# The co-folding predictors themselves are deliberately NOT dependencies -- they are external
# subprocesses behind uniform adapters, each in its own environment.
dependencies = [
    "numpy==1.26.4",            # <2.0: required by DockQ 2.1.3 and matches the generator ecosystem
    "scipy==1.14.1",            # cKDTree for contact detection
    "biotite==1.1.0",           # mmCIF/PDB parsing, superposition
    "scikit-learn>=1.5,<2",     # HistGradientBoosting ranker
    "joblib>=1.4",              # checkpoint persistence + parallel structure parsing
    "polars==1.17.1",           # ranking tables and manifests
    "pyarrow==18.1.0",          # parquet backend
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.8.4"]

[project.scripts]
cofoldrank = "cofoldrank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The released selector checkpoint (~1.1 MB) ships with the package so `PoolSelector()` works
# with no configuration. Override with $COFOLDRANK_SELECTOR.
[tool.setuptools.package-data]
"cofoldrank.select" = ["checkpoints/*.joblib"]

# --- torch cu128 wheels: pull torch from the PyTorch index, everything else from PyPI ---
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ANARCI (CLAUDE.md 5.3) is NOT pip-installable cleanly (needs the HMMER binary).
# Installed separately at Stage 3/M3 time (bioconda `anarci` or oxpig/ANARCI from source).
# It is only needed for CDR-localized jitter (M3) and paratope ID, not for M0-M2.
