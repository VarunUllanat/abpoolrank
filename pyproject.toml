[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abpoolrank"
version = "1.3.0"
description = "Predictor-agnostic structural selection for antibody-antigen co-folding"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Varun Ullanat", email = "varun@divergencelabs.com" }]
keywords = ["antibody", "antigen", "structure prediction", "co-folding", "protein docking", "ranking"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Core = what `abpoolrank select` needs: parse structures, compare poses, score the pool.
# The co-folding predictors themselves are NOT dependencies: run them however you like and point the
# selector at their output structures.
dependencies = [
    "numpy==1.26.4",            # <2.0: required by DockQ 2.1.3 and matches the generator ecosystem
    "scipy==1.14.1",            # cKDTree for contact detection
    "biotite==1.1.0",           # mmCIF/PDB parsing, superposition
    "scikit-learn>=1.5,<2",     # HistGradientBoosting ranker
    "joblib>=1.4",              # checkpoint persistence + parallel structure parsing
    "polars==1.17.1",           # ranking tables and manifests
    "pyarrow==18.1.0",          # parquet backend
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.8.4"]

[project.urls]
Homepage = "https://github.com/VarunUllanat/abpoolrank"
Source = "https://github.com/VarunUllanat/abpoolrank"
Issues = "https://github.com/VarunUllanat/abpoolrank/issues"

[project.scripts]
abpoolrank = "abpoolrank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The released selector checkpoints (both / paired-only / vhh-only, ~2.6 MB) ship with the package so `PoolSelector()` works
# with no configuration. Override with $ABPOOLRANK_SELECTOR.
[tool.setuptools.package-data]
"abpoolrank.select" = ["checkpoints/*.joblib"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
